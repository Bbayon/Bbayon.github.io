<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weighted Wheel of Names</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #f97316;
      --accent-hover: #ea580c;
      --accent-danger: #ef4444;
      --accent-danger-hover: #dc2626;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--card-border);
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f97316, #eab308);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    /* Sidebar Styling */
    .sidebar {
      background-color: var(--card-bg);
      border-right: 1px solid var(--card-border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .name-count {
      font-size: 0.85rem;
      background-color: var(--card-border);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      color: var(--text-muted);
    }

    .input-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 200px;
      background-color: var(--bg-color);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-primary);
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .btn {
      background-color: var(--card-border);
      color: var(--text-main);
      border: none;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #475569;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Wheel Canvas Section */
    .wheel-section {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 10px 30px var(--shadow-color);
    }

    /* Top Indicator Arrow */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* Center Spin Button */
    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: white;
      border: 4px solid #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 5;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 6px 24px rgba(249, 115, 22, 0.6);
    }

    .spin-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
      transform: translate(-50%, -50%);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid #f97316;
      border-radius: 16px;
      padding: 2.5rem;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h3 {
      color: var(--text-muted);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .modal-card .winner-name {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
      word-break: break-word;
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
    }

    .modal-actions .btn {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.95rem;
    }

    .btn-danger {
      background-color: var(--accent-danger);
    }

    .btn-danger:hover {
      background-color: var(--accent-danger-hover);
    }

    .btn-primary {
      background-color: var(--accent-primary);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    /* Fire Canvas Overlay */
    #fireCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    @media (max-width: 850px) {
      .app-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        overflow: visible;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
      }

      textarea {
        min-height: 120px;
      }

      .canvas-wrapper {
        max-width: 380px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Weighted Wheel of Names</h1>
    <span style="font-size: 0.85rem; color: var(--text-muted);">Press <strong>Spacebar</strong> to spin</span>
  </header>

  <div class="app-container">
    <section class="sidebar">
      <div class="sidebar-header">
        <h2>List & Weights</h2>
        <span class="name-count" id="nameCount">0 entries</span>
      </div>
      
      <p class="input-hint">Format: <code>Name, Weight</code> (e.g., <code>Alice, 3</code> or <code>Bob</code> for default weight 1).</p>

      <textarea id="namesInput" placeholder="Alice, 2&#10;Bob, 1&#10;Borja, 3" spellcheck="false"></textarea>

      <div class="action-buttons">
        <button class="btn" id="shuffleBtn">Shuffle</button>
        <button class="btn" id="sortBtn">Sort</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
    </section>

    <main class="wheel-section">
      <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas"></canvas>
        <button class="spin-btn" id="spinBtn">SPIN</button>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="winnerModal">
    <div class="modal-card">
      <h3>🔥 Winner Selected! 🔥</h3>
      <div class="winner-name" id="winnerNameDisplay">---</div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="removeWinnerBtn">Remove Entry</button>
        <button class="btn btn-primary" id="closeModalBtn">Keep / Close</button>
      </div>
    </div>
  </div>

  <canvas id="fireCanvas"></canvas>

  <script>
    const PALETTE = [
      '#EF4444', '#F97316', '#F59E0B', '#10B981', 
      '#06B6D4', '#3B82F6', '#6366F1', '#8B5CF6', 
      '#EC4899', '#14B8A6', '#84CC16', '#A855F7'
    ];

    let items = []; // Array of { name: string, weight: number, rawLine: string }
    let totalWeight = 0;
    let currentRotation = 0;
    let isSpinning = false;
    let winningIndex = -1;

    const namesInput = document.getElementById('namesInput');
    const nameCount = document.getElementById('nameCount');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const sortBtn = document.getElementById('sortBtn');
    const clearBtn = document.getElementById('clearBtn');
    const spinBtn = document.getElementById('spinBtn');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    const winnerModal = document.getElementById('winnerModal');
    const winnerNameDisplay = document.getElementById('winnerNameDisplay');
    const removeWinnerBtn = document.getElementById('removeWinnerBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Default list
    namesInput.value = "Steady Matteo, 1\nDavdo, 2\nBorja, 3\nHugo, 1\nMarcos, 1";

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawWheel();
    }

    window.addEventListener('resize', resizeCanvas);

    function parseInput() {
      const lines = namesInput.value.split('\n');
      items = [];
      totalWeight = 0;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        const parts = trimmed.split(/[,:]/);
        const name = parts[0].trim();
        let weight = 1;

        if (parts.length > 1) {
          const parsedWeight = parseFloat(parts[1].trim());
          if (!isNaN(parsedWeight) && parsedWeight > 0) {
            weight = parsedWeight;
          }
        }

        if (name) {
          items.push({ name, weight, rawLine: trimmed });
          totalWeight += weight;
        }
      });

      nameCount.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
      spinBtn.disabled = isSpinning || items.length === 0;
      drawWheel();
    }

    namesInput.addEventListener('input', parseInput);

    shuffleBtn.addEventListener('click', () => {
      if (isSpinning) return;
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      namesInput.value = items.map(item => item.rawLine).join('\n');
      parseInput();
    });

    sortBtn.addEventListener('click', () => {
      if (isSpinning) return;
      items.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
      namesInput.value = items.map(item => item.rawLine).join('\n');
      parseInput();
    });

    clearBtn.addEventListener('click', () => {
      if (isSpinning) return;
      namesInput.value = '';
      parseInput();
    });

    function drawWheel() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(centerX, centerY) - 8;

      ctx.clearRect(0, 0, width, height);

      if (items.length === 0 || totalWeight === 0) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#475569';
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 16px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Add names to spin!', centerX, centerY);
        return;
      }

      let cumulativeAngle = currentRotation;

      items.forEach((item, i) => {
        const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);
        const startAngle = cumulativeAngle;
        const endAngle = cumulativeAngle + sliceAngle;

        let colorIndex = i % PALETTE.length;
        if (i === items.length - 1 && colorIndex === 0 && items.length > 1) {
          colorIndex = 1;
        }

        // Slice path
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = PALETTE[colorIndex];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // Text rendering
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';

        const fontSize = Math.min(22, Math.max(10, Math.floor(180 * (item.weight / totalWeight))));
        ctx.font = `700 ${fontSize}px system-ui`;

        const label = item.weight !== 1 ? `${item.name} (${item.weight})` : item.name;
        const maxTextWidth = radius * 0.65;
        let formattedText = label;

        if (ctx.measureText(formattedText).width > maxTextWidth) {
          while (formattedText.length > 0 && ctx.measureText(formattedText + '…').width > maxTextWidth) {
            formattedText = formattedText.slice(0, -1);
          }
          formattedText += '…';
        }

        ctx.fillText(formattedText, radius - 24, 0);
        ctx.restore();

        cumulativeAngle = endAngle;
      });

      // Outer border
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();
    }

    function spin() {
      if (isSpinning || items.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;

      // Weighted Random Selection
      const rand = Math.random() * totalWeight;
      let acc = 0;
      let selectedIdx = 0;

      for (let i = 0; i < items.length; i++) {
        acc += items[i].weight;
        if (rand <= acc) {
          selectedIdx = i;
          break;
        }
      }

      // Compute angles for target slice
      let startWeightAcc = 0;
      for (let i = 0; i < selectedIdx; i++) {
        startWeightAcc += items[i].weight;
      }

      const sliceStartAngle = (startWeightAcc / totalWeight) * 2 * Math.PI;
      const sliceAngle = (items[selectedIdx].weight / totalWeight) * 2 * Math.PI;
      const sliceMidAngle = sliceStartAngle + sliceAngle / 2;

      // Pointer is at 12 o'clock (1.5 * PI)
      const pointerAngle = 1.5 * Math.PI;
      let targetOffset = (pointerAngle - sliceMidAngle) % (2 * Math.PI);
      if (targetOffset < 0) targetOffset += 2 * Math.PI;

      const spinDuration = 4000;
      const startTime = performance.now();
      const startRotation = currentRotation;
      const extraRotations = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
      const currentMod = startRotation % (2 * Math.PI);
      const totalRotationNeeded = extraRotations + (targetOffset - currentMod + 2 * Math.PI) % (2 * Math.PI);
      const targetRotation = startRotation + totalRotationNeeded;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentRotation = startRotation + (targetRotation - startRotation) * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          winningIndex = selectedIdx;
          showWinnerModal();
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinnerModal() {
      let winningName = items[winningIndex].name;

      // REQUIREMENT 2: Instant replacement if "Borja" is selected
      if (winningName.trim().toLowerCase() === 'borja') {
        winningName = 'Hugo';
      }

      winnerNameDisplay.textContent = winningName;
      winnerModal.classList.add('active');
      
      // REQUIREMENT 3: Fire effect trigger
      triggerFireEffect();
    }

    function hideWinnerModal() {
      winnerModal.classList.remove('active');
    }

    removeWinnerBtn.addEventListener('click', () => {
      if (winningIndex >= 0 && winningIndex < items.length) {
        items.splice(winningIndex, 1);
        namesInput.value = items.map(item => item.rawLine).join('\n');
        parseInput();
      }
      hideWinnerModal();
    });

    closeModalBtn.addEventListener('click', hideWinnerModal);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== namesInput) {
        e.preventDefault();
        spin();
      }
    });

    spinBtn.addEventListener('click', spin);

    // --- REQUIREMENT 3: Canvas Fire Particle Animation ---
    const fireCanvas = document.getElementById('fireCanvas');
    const fCtx = fireCanvas.getContext('2d');
    let fireParticles = [];
    let fireAnimationFrame;

    function triggerFireEffect() {
      fireCanvas.width = window.innerWidth;
      fireCanvas.height = window.innerHeight;
      fireParticles = [];

      // Spawn concentrated burst of fire particles
      for (let i = 0; i < 220; i++) {
        fireParticles.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 160,
          y: window.innerHeight / 2 + 80,
          vx: (Math.random() - 0.5) * 7,
          vy: -Math.random() * 12 - 4,
          radius: Math.random() * 25 + 15,
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015
        });
      }

      cancelAnimationFrame(fireAnimationFrame);
      updateFire();
    }

    function updateFire() {
      fCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
      fCtx.globalCompositeOperation = 'lighter'; // Realistic fire blend mode

      let activeParticles = false;

      fireParticles.forEach(p => {
        if (p.life > 0) {
          activeParticles = true;
          p.x += p.vx + (Math.random() - 0.5) * 2;
          p.y += p.vy;
          p.radius *= 0.96; // Shrink as it rises
          p.life -= p.decay;

          const alpha = Math.max(0, p.life);

          // Color transition: White/Yellow -> Orange -> Red -> Smoke Fade
          let r = 255, g = 0, b = 0;
          if (p.life > 0.7) {
            g = 255; b = 180; // Intense yellow/white flame core
          } else if (p.life > 0.4) {
            g = 140; b = 0; // Fire orange
          } else {
            g = 20; b = 0; // Dark red rim
          }

          const gradient = fCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, p.radius));
          gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
          gradient.addColorStop(1, `rgba(${r}, 0, 0, 0)`);

          fCtx.beginPath();
          fCtx.arc(p.x, p.y, Math.max(1, p.radius), 0, Math.PI * 2);
          fCtx.fillStyle = gradient;
          fCtx.fill();
        }
      });

      if (activeParticles) {
        fireAnimationFrame = requestAnimationFrame(updateFire);
      } else {
        fCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
      }
    }

    // Init
    parseInput();
    resizeCanvas();
  </script>
</body>
</html>
